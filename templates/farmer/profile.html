{% extends "base.html" %}

{% block title %}Farmer Profile - OnionGrade AI{% endblock %}
{% block page_title %}Farmer Profile{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
  <div class="card">
    <div class="card-header">
      <h3>🧑‍🌾 Farmer Profile Details</h3>
    </div>
    <div class="card-body">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem;">
        <div>
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" value="{{ user.name }}" readonly>
        </div>
        <div>
          <label class="form-label">Farmer ID</label>
          <input type="text" class="form-control" value="{{ farmer.farmer_id }}" readonly style="font-weight: 700; color: var(--primary-green);">
        </div>
        <div>
          <label class="form-label">Registered Mobile</label>
          <input type="text" class="form-control" value="{{ user.phone }}" readonly>
        </div>
        <div>
          <label class="form-label">Email Address</label>
          <input type="text" class="form-control" value="{{ user.email or 'Not provided' }}" readonly>
        </div>
        <div>
          <label class="form-label">Village</label>
          <input type="text" class="form-control" value="{{ farmer.village }}" readonly>
        </div>
        <div>
          <label class="form-label">Taluka</label>
          <input type="text" class="form-control" value="{{ farmer.taluka }}" readonly>
        </div>
        <div>
          <label class="form-label">District</label>
          <input type="text" class="form-control" value="{{ farmer.district }}" readonly>
        </div>
        <div>
          <label class="form-label">State</label>
          <input type="text" class="form-control" value="{{ farmer.state }}" readonly>
        </div>
      </div>
    </div>
  </div>

  <!-- Change Password Form -->
  <div class="card">
    <div class="card-header">
      <h3>🔒 Change Security Password</h3>
    </div>
    <div class="card-body">
      <form id="changePasswordForm" style="max-width: 450px;">
        <div class="form-group">
          <label class="form-label" for="oldPassword">Current Password</label>
          <input type="password" id="oldPassword" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password (min 6 chars)</label>
          <input type="password" id="newPassword" class="form-control" minlength="6" required>
        </div>
        <button type="submit" id="changePasswordBtn" class="btn btn-primary">
          Update Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById("changePasswordForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("changePasswordBtn");
  btn.disabled = true;

  try {
    const res = await fetch("/api/auth/change-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        old_password: document.getElementById("oldPassword").value,
        new_password: document.getElementById("newPassword").value
      })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      showToast(data.message, "success");
      document.getElementById("changePasswordForm").reset();
    } else {
      showToast(data.error || "Failed to update password", "error");
    }
  } catch (err) {
    showToast("Network error: " + err.message, "error");
  } finally {
    btn.disabled = false;
  }
});
</script>
{% endblock %}
